<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allianz Senk Schaufenster</title>
    <style>
        :root {
            --allianz-gold: #a3890e;
            --koenigsblau: #003781;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.45);
            --text-light: #f5f7fb;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #000814;
            color: var(--text-light);
        }

        /* Vollbild-Slideshow. Kein CSS-inset: Android-WebView / Fully
           kennt das oft nicht, dann ist die Fläche 0x0 und nur Widgets
           bleiben sichtbar. Zoom nur auf dem Foto, nicht auf dem Slide. */
        #slideshow {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            background-color: #000814;
        }

        .slide {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
            overflow: hidden;
            background-color: #000814;
        }

        .slide.active {
            opacity: 1;
        }

        /* Zoom liegt nur auf dem img, der Slide selbst fadet/wechselt.
           So bleibt der Ken-Burns-Effekt ohne das alte Zwischenfoto. */
        .slide img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            border: 0;
            transform: scale(1);
            -webkit-transform: scale(1);
            transform-origin: center center;
            -webkit-transform-origin: center center;
        }

        .slide.active img.kenburns {
            animation: kenburns 8s ease-in-out forwards;
            -webkit-animation: kenburns 8s ease-in-out forwards;
        }

        html.kiosk-simple .slide {
            opacity: 1;
            transition: none;
            visibility: hidden;
        }

        html.kiosk-simple .slide.active {
            visibility: visible;
        }

        @keyframes kenburns {
            0% {
                transform: scale(1);
                -webkit-transform: scale(1);
            }
            100% {
                transform: scale(1.08);
                -webkit-transform: scale(1.08);
            }
        }

        @-webkit-keyframes kenburns {
            0% {
                -webkit-transform: scale(1);
                transform: scale(1);
            }
            100% {
                -webkit-transform: scale(1.08);
                transform: scale(1.08);
            }
        }

        /* Permanentes Logo oben rechts */
        #logo {
            position: fixed;
            top: 40px;
            right: 32px;
            width: 320px;
            max-width: 30vw;
            z-index: 100;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6));
        }

        /* Wetter-Box mit Glassmorphism */
        #weather-box {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 10;
            min-width: 260px;
            padding: 18px 26px 20px;
            border-radius: 22px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            color: var(--text-light);
        }

        #weather-location {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--allianz-gold);
            margin-bottom: 6px;
        }

        #weather-main {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 4px;
        }

        #temp {
            font-size: 2.7rem;
            font-weight: 600;
        }

        #weather-emoji {
            font-size: 3.2rem;
            line-height: 1;
        }

        #desc {
            margin-top: 10px;
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            opacity: 0.95;
        }

        /* News-Ticker mit Glassmorphism */
        #ticker-container {
            position: fixed;
            left: 5%;
            bottom: 32px;
            width: 90%;
            height: 80px;
            z-index: 10;
            display: flex;
            align-items: stretch;
            border-radius: 999px;
            overflow: hidden;
            background:
                linear-gradient(120deg, rgba(0, 0, 0, 0.82), rgba(0, 0, 30, 0.7));
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        #ticker-label {
            background: linear-gradient(135deg, var(--allianz-gold), #e5c552);
            color: #11131f;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            box-shadow: 8px 0 18px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        #ticker-wrap {
            position: relative;
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        #ticker-content {
            position: absolute;
            white-space: nowrap;
            padding-left: 100%;
            font-size: 1.4rem;
            color: #ffffff;
            animation: ticker-scroll 45s linear infinite;
        }

        @keyframes ticker-scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        @media (max-width: 900px) {
            #logo {
                width: 230px;
                top: 24px;
                right: 24px;
            }

            #weather-box {
                top: 24px;
                left: 24px;
            }

            #ticker-container {
                left: 4%;
                width: 92%;
                height: 72px;
            }

            #ticker-content {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

    <script src="abfolge.js"></script>
    <script>
        (function () {
            "use strict";

            /* ----------------------------------------
             * 1. Vollbild-Bilderslideshow
             *
             * Playlist steht inline in SLIDESHOW_ABFOLGE, damit Fully
             * Kiosk nicht von einem extra JS-File oder Redirect abhängt.
             * ---------------------------------------- */
            var slideIntervalMs = 8000;
            var kioskSimple = /Android|Fully|Kiosk/i.test(navigator.userAgent || "") || /[?&]kiosk=1(?:&|$)/.test(window.location.search || "");
            if (kioskSimple) {
                document.documentElement.className += (document.documentElement.className ? " " : "") + "kiosk-simple";
            }

            var slideA = document.getElementById("slideA");
            var slideB = document.getElementById("slideB");
            var imgA = document.getElementById("imgA");
            var imgB = document.getElementById("imgB");
            var slides = [slideA, slideB];
            var slideImgs = [imgA, imgB];

            var imageUrls = [];
            var currentIndex = 0;
            var activeSlideIndex = 0;
            var loadGeneration = 0;

            function pageBase() {
                var href = String(window.location.href || "").split("#")[0].split("?")[0];
                if (!href) {
                    return "";
                }
                if (/\.html?$/i.test(href)) {
                    return href.substring(0, href.lastIndexOf("/") + 1);
                }
                if (href.charAt(href.length - 1) !== "/") {
                    return href + "/";
                }
                return href;
            }

            function assetUrl(relativePath) {
                var encoded = String(relativePath).split("/").map(function (part) {
                    return encodeURIComponent(part);
                }).join("/");
                return pageBase() + encoded;
            }

            function playlistFromEmbedded() {
                var data = window.SLIDESHOW_ABFOLGE;
                if (!data || !data.ordner || data.ordner.length === 0) {
                    return null;
                }
                var urls = [];
                var i;
                var j;
                var folder;
                var names;
                for (i = 0; i < data.ordner.length; i++) {
                    folder = data.ordner[i];
                    names = (data.bilder && data.bilder[folder]) || [];
                    for (j = 0; j < names.length; j++) {
                        urls.push(assetUrl(folder + "/" + names[j]));
                    }
                }
                return { folders: data.ordner, urls: urls };
            }

            function startKenBurns(img) {
                if (!img) {
                    return;
                }
                img.className = "";
                void img.offsetWidth;
                img.className = "kenburns";
            }

            function showUrlOnIncomingSlide(url) {
                var incomingSlideIndex = 1 - activeSlideIndex;
                var incomingSlide = slides[incomingSlideIndex];
                var incomingImg = slideImgs[incomingSlideIndex];
                var outgoingImg = slideImgs[activeSlideIndex];
                var generation;
                if (!incomingSlide || !incomingImg) {
                    return;
                }

                generation = ++loadGeneration;

                function activate() {
                    if (generation !== loadGeneration) {
                        return;
                    }
                    incomingImg.onload = null;
                    incomingImg.onerror = null;
                    if (!incomingImg.naturalWidth) {
                        return;
                    }
                    slides[activeSlideIndex].className = "slide";
                    if (outgoingImg) {
                        outgoingImg.className = "";
                    }
                    incomingSlide.className = "slide active";
                    startKenBurns(incomingImg);
                    activeSlideIndex = incomingSlideIndex;
                }

                incomingImg.onload = activate;
                incomingImg.onerror = function () {
                    incomingImg.onload = null;
                    incomingImg.onerror = null;
                };
                incomingImg.src = url;
                if (incomingImg.complete) {
                    activate();
                }
            }

            function showNextSlide() {
                if (imageUrls.length === 0) {
                    return;
                }
                currentIndex = (currentIndex + 1) % imageUrls.length;
                showUrlOnIncomingSlide(imageUrls[currentIndex]);
            }

            (function initSlideshow() {
                var playlist = playlistFromEmbedded();
                if (!playlist || playlist.urls.length === 0) {
                    if (imgA && !imgA.getAttribute("src")) {
                        console.error("Keine Slideshow-Bilder gefunden.");
                    }
                    return;
                }

                imageUrls = playlist.urls;
                currentIndex = 0;
                document.body.setAttribute("data-slideshow-count", String(imageUrls.length));
                document.body.setAttribute("data-slideshow-folders", playlist.folders.join(" | "));
                document.body.setAttribute("data-slideshow-first", imageUrls[0]);
                document.body.setAttribute("data-slideshow-last", imageUrls[imageUrls.length - 1]);

                imgA.src = imageUrls[0];
                startKenBurns(imgA);

                setInterval(showNextSlide, slideIntervalMs);
            })();

            /* ----------------------
             * 2. Uhrzeit (in Wetter-Box)
             * ---------------------- */
            function updateClock() {
                const now = new Date();
                const options = { hour: "2-digit", minute: "2-digit" };
                var clockEl = document.getElementById("desc");
                if (clockEl) {
                    clockEl.innerText = now.toLocaleTimeString("de-DE", options);
                }
            }

            updateClock();
            setInterval(updateClock, 1000);

            /* --------------------------
             * 3. Live-Wetter (Open-Meteo)
             * -------------------------- */
            const weatherUrl =
                "https://api.open-meteo.com/v1/forecast?latitude=50.6444&longitude=7.2274&current_weather=true";

            function mapWeatherCodeToEmojiAndText(code) {
                // Mapping gemäß Open-Meteo Wettercodes
                if (code === 0) return { emoji: "☀️", text: "Klarer Himmel" };
                if (code === 1) return { emoji: "🌤️", text: "Überwiegend klar" };
                if (code === 2) return { emoji: "⛅", text: "Teilweise bewölkt" };
                if (code === 3) return { emoji: "☁️", text: "Bewölkt" };
                if (code === 45 || code === 48) return { emoji: "🌫️", text: "Nebel" };
                if (code === 51 || code === 53 || code === 55) return { emoji: "🌦️", text: "Nieselregen" };
                if (code === 61 || code === 63 || code === 65) return { emoji: "🌧️", text: "Regen" };
                if (code === 66 || code === 67) return { emoji: "🌧️", text: "Gefrierender Regen" };
                if (code === 71 || code === 73 || code === 75 || code === 77) return { emoji: "❄️", text: "Schnee" };
                if (code === 80 || code === 81 || code === 82) return { emoji: "🌧️", text: "Regenschauer" };
                if (code === 85 || code === 86) return { emoji: "🌨️", text: "Schneeschauer" };
                if (code === 95) return { emoji: "⛈️", text: "Gewitter" };
                if (code === 96 || code === 99) return { emoji: "⛈️", text: "Gewitter mit Hagel" };
                return { emoji: "ℹ️", text: "Wetterdaten" };
            }

            function updateWeather() {
                fetch(weatherUrl)
                    .then(function (res) {
                        if (!res.ok) {
                            throw new Error("Wetter-HTTP-Fehler: " + res.status);
                        }
                        return res.json();
                    })
                    .then(function (data) {
                        console.log("Wetter-Daten:", data);
                        if (!data || !data.current_weather) {
                            throw new Error("Wetterdaten unvollständig");
                        }
                        const temp = Math.round(data.current_weather.temperature);
                        const code = data.current_weather.weathercode;
                        const mapped = mapWeatherCodeToEmojiAndText(code);

                        document.getElementById("temp").innerText = temp + "°C";
                        document.getElementById("weather-emoji").innerText = mapped.emoji;
                    })
                    .catch(function (err) {
                        console.error("Fehler beim Abrufen der Wetterdaten:", err);
                    });
            }

            updateWeather();
            // Alle 30 Minuten aktualisieren
            setInterval(updateWeather, 30 * 60 * 1000);

            /* --------------------------
             * 4. News-Ticker
             * -------------------------- */
            const tickerMessages = [
                "Willkommen bei Allianz Senk Bad Honnef",
                "Ihr Partner für Versicherungen und Vorsorge",
                "Wir freuen uns auf Ihren Besuch!"
            ];

            function setTickerFromArray(arr) {
                const text =
                    "+++ " + arr.join(" +++ ") + " +++ ";
                const ticker = document.getElementById("ticker-content");
                ticker.textContent = text;
                ticker.style.animation = "none";
                void ticker.offsetWidth;
                ticker.style.animation = "";
            }

            setTickerFromArray(tickerMessages);
        })();
    </script>
